<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ====================== helpers ======================
const NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const smooth=x=>x*x*(3-2*x);
const easeOutBack=(x,s=1.8)=>{x=clamp(x);const c3=s+1;return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2);};
const easeOutCubic=x=>1-Math.pow(1-clamp(x),3);
const easeInCubic=x=>Math.pow(clamp(x),3);
const easeInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const elastic=x=>{x=clamp(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1;};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const svg=document.getElementById('s');
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function H(parent,markup){parent.insertAdjacentHTML('beforeend',markup);return parent.lastElementChild;}
const $=id=>document.getElementById(id);
const tr=(e,x,y,r=0,sx=1,sy=sx)=>e.setAttribute('transform',`translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${sx.toFixed(4)},${sy.toFixed(4)})`);

// ====================== DEFS ======================
const defs=H(svg,`<defs>

<radialGradient id="gSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFBE0"/><stop offset=".25" stop-color="#FFF2A8" stop-opacity=".95"/><stop offset=".5" stop-color="#FFE48A" stop-opacity=".35"/><stop offset="1" stop-color="#FFE48A" stop-opacity="0"/></radialGradient>

<linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE6A6"/><stop offset=".45" stop-color="#F8CD7C"/><stop offset="1" stop-color="#E7A24D"/></linearGradient>
<linearGradient id="gSandDune" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEDBD"/><stop offset=".35" stop-color="#FAD18A"/><stop offset="1" stop-color="#EDB062"/></linearGradient>
<linearGradient id="gPond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BEBFF"/><stop offset=".55" stop-color="#48BFEA"/><stop offset="1" stop-color="#2A8FCB"/></linearGradient>

<linearGradient id="gFrondDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DBF4A"/><stop offset="1" stop-color="#22783A"/></linearGradient>
<radialGradient id="gBush" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#A6EC7E"/><stop offset=".55" stop-color="#55B94E"/><stop offset="1" stop-color="#2E8540"/></radialGradient>

<radialGradient id="gCamel" cx=".36" cy=".28" r=".85"><stop offset="0" stop-color="#FFE2AE"/><stop offset=".4" stop-color="#F1BC77"/><stop offset=".8" stop-color="#D99650"/><stop offset="1" stop-color="#C27B38"/></radialGradient>

<linearGradient id="gLeg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4C281"/><stop offset=".5" stop-color="#E0A15A"/><stop offset="1" stop-color="#BF7B37"/></linearGradient>
<linearGradient id="gLegDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D79A57"/><stop offset=".5" stop-color="#BD7C3C"/><stop offset="1" stop-color="#985A24"/></linearGradient>
<linearGradient id="gShadeB" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#7A3A0A" stop-opacity="0"/><stop offset="1" stop-color="#7A3A0A" stop-opacity=".38"/></linearGradient>

<radialGradient id="gMuzzle" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#FFF5E0"/><stop offset=".7" stop-color="#F9DDAE"/><stop offset="1" stop-color="#EDC28A"/></radialGradient>
<radialGradient id="gIris" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#8A4E24"/><stop offset=".6" stop-color="#4A2410"/><stop offset="1" stop-color="#1E0D04"/></radialGradient>
<linearGradient id="gScarf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BF0DE"/><stop offset=".55" stop-color="#1FC2BE"/><stop offset="1" stop-color="#0E8E99"/></linearGradient>
<radialGradient id="gTuft" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#C98142"/><stop offset="1" stop-color="#8A4E1E"/></radialGradient>

<radialGradient id="gBalR" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#FFB3B8"/><stop offset=".35" stop-color="#FF4D5B"/><stop offset=".8" stop-color="#D31B2C"/><stop offset="1" stop-color="#9E0C1A"/></radialGradient>

<radialGradient id="gBalG" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#C8FFD6"/><stop offset=".35" stop-color="#3FDB72"/><stop offset=".8" stop-color="#1AA34A"/><stop offset="1" stop-color="#0E7334"/></radialGradient>

<radialGradient id="gApple" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FF9C9C"/><stop offset=".4" stop-color="#F2283A"/><stop offset=".85" stop-color="#B5101F"/><stop offset="1" stop-color="#860A15"/></radialGradient>
<linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BEA6A"/><stop offset="1" stop-color="#2E9A3A"/></linearGradient>

<radialGradient id="gMelon" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#A8F08E"/><stop offset=".45" stop-color="#47B54A"/><stop offset="1" stop-color="#1B6B2A"/></radialGradient>
<radialGradient id="gVignette" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a1200" stop-opacity=".28"/></radialGradient>

<filter id="blur1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>

<path id="balloonShape" d="M0 -132 C 76 -132 114 -72 114 -6 C 114 70 62 126 0 134 C -62 126 -114 70 -114 -6 C -114 -72 -76 -132 0 -132 Z"/>
<clipPath id="clipBody"><ellipse cx="0" cy="-205" rx="180" ry="128"/></clipPath>

// ====================== CAMERA / LAYERS ======================
const cam=el('g',{id:'cam'},svg);
const Lsky=el('g',{},cam), Lfar=el('g',{},cam), Lmid=el('g',{},cam), Lnear=el('g',{},cam), Lfx=el('g',{},cam);

// Sky
H(Lsky,`<rect x="-200" y="-200" width="1480" height="1600" fill="url(#gSky)"/>`);
H(Lsky,`<circle id="sun" cx="850" cy="330" r="300" fill="url(#gSun)"/>`);
H(Lsky,`<circle cx="850" cy="330" r="78" fill="#FFF7CF"/>`);
function cloud(id,scale){return `<g id="${id}"><g transform="scale(${scale})" filter="url(#softDrop)">
 <ellipse cx="0" cy="20" rx="150" ry="48" fill="url(#gCloud)"/>
 <circle cx="-70" cy="0" r="60" fill="url(#gCloud)"/><circle cx="10" cy="-30" r="80" fill="url(#gCloud)"/><circle cx="90" cy="5" r="55" fill="url(#gCloud)"/>
 <ellipse cx="-10" cy="-55" rx="40" ry="22" fill="#fff" opacity=".9"/></g></g>`;}
H(Lsky,cloud('cl1',1.0));H(Lsky,cloud('cl2',.7));H(Lsky,cloud('cl3',.85));

// Far dunes (atmospheric, blurred)
H(Lfar,`<g filter="url(#blurFar)">
 <path d="M-200 1130 C 0 1020 180 1040 330 1090 C 480 1140 600 1000 800 1010 C 960 1020 1100 1080 1300 1060 L 1300 1400 L -200 1400 Z" fill="url(#gDuneFar)"/>
 <path d="M-200 1180 C 50 1120 220 1150 420 1170 C 640 1190 760 1110 980 1130 C 1120 1145 1220 1170 1300 1160 L 1300 1400 L -200 1400 Z" fill="url(#gDuneFar2)"/>
</g>`);

// Mid: oasis (grass band, palms, pond, bushes)
function palm(x,y,h,flip,dark){const f=flip?-1:1;const fr=dark?'gFrondDark':'gFrond';
 let s=`<g transform="translate(${x},${y}) scale(${f},1)">`;
 s+=`<ellipse cx="0" cy="6" rx="70" ry="14" fill="#2c6b2a" opacity=".35" filter="url(#blur6)"/>`;
 s+=`<path d="M -16 0 C -10 ${-h*.4} 10 ${-h*.75} 40 ${-h} L 62 ${-h+6} C 36 ${-h*.72} 18 ${-h*.4} 16 0 Z" fill="url(#gTrunk)"/>`;
 for(let i=1;i<9;i++){const p=i/9;const yy=-h*p;const xx=lerp(0,50,p*p);s+=`<path d="M ${xx-17} ${yy} q 17 8 34 0" stroke="#6E401C" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>`;}
 const tx=50,ty=-h;
 const angles=[-160,-130,-100,-60,-25,10,35];
 angles.forEach((a,i)=>{const r=a*Math.PI/180;const L=h*.55;const ex=tx+Math.cos(r)*L,ey=ty+Math.sin(r)*L*.55+L*.35;const cx=tx+Math.cos(r)*L*.5,cy=ty+Math.sin(r)*L*.5-40;
  s+=`<path d="M ${tx} ${ty} Q ${cx} ${cy-18} ${ex} ${ey} Q ${cx+8} ${cy+22} ${tx} ${ty+10} Z" fill="url(#${i%2?fr:'gFrondDark'})"/>`;
  s+=`<path d="M ${tx} ${ty+4} Q ${cx} ${cy+2} ${ex} ${ey}" stroke="#1f6b2c" stroke-width="3" fill="none" opacity=".5"/>`;});
 s+=`<circle cx="${tx-10}" cy="${ty+22}" r="12" fill="#E2762A"/><circle cx="${tx+8}" cy="${ty+26}" r="11" fill="#C85F1C"/><circle cx="${tx-2}" cy="${ty+38}" r="10" fill="#D96A22"/>`;
 return s+'</g>';}
H(Lmid,`<g id="oasis">
 <path d="M-200 1300 C 60 1220 300 1235 540 1250 C 780 1265 960 1215 1300 1260 L 1300 1520 L -200 1520 Z" fill="url(#gGrass)"/>
 <path d="M-200 1300 C 60 1220 300 1235 540 1250 C 780 1265 960 1215 1300 1260" stroke="#C7F7A0" stroke-width="6" fill="none" opacity=".7"/>
 ${palm(990,1300,330,true,true)}
 ${palm(110,1340,420,false,false)}
 ${palm(250,1300,260,false,true)}
 <g filter="url(#softDrop)">
  <ellipse cx="880" cy="1300" rx="95" ry="62" fill="url(#gBush)"/><ellipse cx="960" cy="1318" rx="70" ry="48" fill="url(#gBush)"/>

 </g>

 <path id="pondShine2" d="M790 1398 q 30 -5 60 0" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>
</g>`);

// Near: sand dunes foreground
H(Lnear,`<g id="sand">

 <g transform="translate(60,1700)"><path d="M0 0 q -10 -40 -30 -55 M0 0 q 2 -45 0 -70 M0 0 q 10 -40 30 -55" stroke="#4CAF50" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="0" cy="-74" r="9" fill="#FFD23F"/></g>
</g>`);

// ====================== BALLOONS ======================
const BAL=[

 {id:'b1',g:'gBalY',light:'#FFF4B0',dark:'#C98400',home:[540,640],fruit:'banana',slot:[855,1655],tStart:10.5,tPop:13.1,tEnd:14.9,label:'البالونُ الأَصْفَر...',word:'مَوْزَة!',stroke:'#E7A500'},
 {id:'b2',g:'gBalG',light:'#C8FFD6',dark:'#0E7334',home:[835,700],fruit:'melon',slot:[540,1745],tStart:15.0,tPop:17.6,tEnd:19.4,label:'البالونُ الأَخْضَر...',word:'بِطّيخَةٌ كَبيرَة!',stroke:'#1FA64C'},

 b.el=H(Lbal,`<g id="${b.id}">

  <text id="${b.id}n" x="0" y="34" text-anchor="middle" font-size="120" fill="#fff" stroke="${b.dark}" stroke-width="10" paint-order="stroke" stroke-linejoin="round" opacity="0"></text>
 </g>`);
 b.num=$(b.id+'n');
});

// ====================== FRUITS ======================
const Lfruit=el('g',{},Lnear);
function fruitMarkup(kind){
 if(kind==='apple')return `<ellipse cx="0" cy="92" rx="85" ry="16" fill="#7a3a00" opacity=".3" filter="url(#blur6)" class="fsh"/>

  <circle cx="-38" cy="-52" r="6" fill="#fff" opacity=".9"/>
  <path d="M0 -56 C 2 -78 8 -96 14 -108" stroke="#6E3B14" stroke-width="10" stroke-linecap="round" fill="none"/>

 if(kind==='banana')return `<ellipse cx="0" cy="70" rx="110" ry="15" fill="#7a3a00" opacity=".3" filter="url(#blur6)" class="fsh"/>
  <g class="fb"><path d="M -118 -40 C -78 60 78 72 122 -26 C 128 -40 112 -48 104 -36 C 62 22 -56 18 -98 -52 C -106 -66 -124 -56 -118 -40 Z" fill="url(#gBanana)"/>
  <path d="M -104 -40 C -60 36 62 44 108 -24" stroke="#C88A06" stroke-width="5" fill="none" opacity=".55"/>
  <path d="M -96 -30 C -60 22 30 34 80 6" stroke="#FFF8C8" stroke-width="8" fill="none" opacity=".6" stroke-linecap="round" filter="url(#blur1)"/>
  <path d="M -118 -40 C -122 -50 -120 -60 -112 -62 L -100 -54 Z" fill="#6E4A12"/>
  <circle cx="122" cy="-30" r="8" fill="#6E4A12"/></g>`;
 return `<ellipse cx="0" cy="96" rx="120" ry="18" fill="#7a3a00" opacity=".32" filter="url(#blur6)" class="fsh"/>

   ${[-80,-40,0,40,80].map(x=>`<path d="M ${x} -100 C ${x+18} -50 ${x-18} -10 ${x+12} 30 C ${x+30} 60 ${x-6} 80 ${x+6} 110" stroke="#1A5E24" stroke-width="16" fill="none" stroke-linecap="round"/>`).join('')}

  <ellipse cx="-50" cy="-42" rx="34" ry="18" fill="#fff" opacity=".45" transform="rotate(-25 -50 -42)" filter="url(#blur1)"/>
  <circle cx="-30" cy="-58" r="7" fill="#fff" opacity=".85"/>
  <path d="M 0 -92 q 6 -16 18 -18" stroke="#6E3B14" stroke-width="7" stroke-linecap="round" fill="none"/></g>`;
}
BAL.forEach(b=>{b.f=H(Lfruit,`<g opacity="0">${fruitMarkup(b.fruit)}</g>`);b.fsh=b.f.querySelector('.fsh');});

 // --- balloons ---
 let focus=null;
 BAL.forEach((b,i)=>{
  // intro rise

 $('brows').setAttribute('transform',`translate(0 ${browUp})`);
 // mouth
 let m=0,inS=false;SPEAK.forEach(([a,b])=>{if(t>=a&&t<=b){inS=true;const env=Math.min(1,(t-a)/.08,(b-t)/.08);m=Math.max(m,env*(.25+.75*Math.abs(Math.sin(t*13.5))*(.6+.4*Math.sin(t*3.1))));}});
 let oShape=0;BAL.forEach(b=>{const d=t-b.tPop;if(d>-.2&&d<.35)oShape=1;});
 const w=oShape?20:34, open=oShape?36:(4+42*m);
 const smileC=oShape?4:16;
 if(open>6){const dpath=`M ${-w} 0 Q 0 ${smileC} ${w} 0 Q ${w*.95} ${open} 0 ${open+smileC*.6} Q ${-w*.95} ${open} ${-w} 0 Z`;
   mOpen.setAttribute('d',dpath);mClip.setAttribute('d',dpath);mTongue.setAttribute('cy',(open*.85).toFixed(1));mTongue.setAttribute('opacity',1);mLine.setAttribute('d',`M ${-w} 0 Q 0 ${smileC} ${w} 0`);mLine.setAttribute('stroke-width',5);}
 else {mOpen.setAttribute('d','');mTongue.setAttribute('opacity',0);mLine.setAttribute('d',`M -36 -4 Q 0 26 36 -4`);mLine.setAttribute('stroke-width',7);}

 // --- captions ---
 CAPS.forEach(({t0,t1,c,pop,big})=>{
  if(t<t0||t>t1+.25){c.g.setAttribute('opacity',0);return;}
  let s=pop?easeOutBack(seg(t,t0,t0+.4),big?3:2):1;
  const out=seg(t,t1,t1+.22); s*=1-.6*easeInCubic(out);
  const bob=Math.sin(t*2.6)*5;
  c.g.setAttribute('opacity',(1-out).toFixed(2));
  c.g.setAttribute('transform',`translate(540 ${(c.y+bob).toFixed(1)}) scale(${s.toFixed(4)}) rotate(${(big?Math.sin(t*5)*2.5:0).toFixed(2)})`);
 });
}
window.render=render;window.DUR=DUR;
render(0);
</script></body></html>
